[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbi-desktop"
version = "0.1.0"
description = "Native Linux desktop client for OpenBI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "adnanphp" }]
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[project.scripts]
openbi-desktop = "openbi_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
