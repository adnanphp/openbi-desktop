name: Release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libopengl0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libx11-xcb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Download appimagetool
        run: |
          mkdir -p packaging/tools
          wget -q -O packaging/tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x packaging/tools/appimagetool-x86_64.AppImage

      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./packaging/build-appimage.sh

      - name: List build artifacts
        run: ls -lh *.AppImage *.sha256

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: openbi-desktop-appimage
          path: |
            OpenBI-Desktop-*.AppImage
            OpenBI-Desktop-*.AppImage.sha256
          retention-days: 30

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: OpenBI Desktop ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            OpenBI-Desktop-*.AppImage
            OpenBI-Desktop-*.AppImage.sha256
